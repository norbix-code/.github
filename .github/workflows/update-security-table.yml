name: Update security table

# Keeps the "Supported Versions" table in SECURITY.md in line with the SDKs'
# published releases. scripts/update-security-table.mjs reads
# scripts/security-packages.json, looks up each package's latest stable version
# on its registry, and regenerates the table. If the table changed (a new major
# version, a first release, or a package added to the manifest), this opens —
# or updates — a pull request from the `automation/security-table` branch.
# Ordinary minor/patch releases don't change the table, so no PR is opened.
#
# Pull request vs issue: GITHUB_TOKEN can only open pull requests when the
# organization and repository allow "GitHub Actions to create and approve pull
# requests". norbix-code does not, so the workflow falls back to opening (or
# updating) an issue with the diff and a one-click "create pull request" link
# for the pushed branch. If that setting is ever enabled, it opens the PR itself.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
  # Optional: an SDK release workflow can trigger this right after publishing
  # with `gh api repos/norbix-code/.github/dispatches -f event_type=sdk-released`
  # (needs a token with access to this repository).
  repository_dispatch:
    types: [sdk-released]

concurrency:
  group: update-security-table
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    name: Regenerate table
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate SECURITY.md table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-security-table.mjs

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- SECURITY.md; then
            echo "SECURITY.md is up to date — nothing to do."
            exit 0
          fi
          git diff -- SECURITY.md

          BRANCH=automation/security-table
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "docs(security): update the supported versions table"
          git push --force origin "$BRANCH"

          TITLE="docs(security): update the supported versions table"
          CHANGES=$(git diff HEAD~1 -- SECURITY.md | grep '^[-+]|' || true)
          COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/main...${BRANCH}?expand=1"

          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            echo "Updated the existing pull request."
          elif gh pr create --base main --head "$BRANCH" --title "$TITLE" \
                 --body "Generated by the **Update security table** workflow from \`scripts/security-packages.json\` and the packages' latest stable releases. A row changed because a package's major version changed, it had its first release, or it was added to the manifest. Review the diff and merge." 2>pr-error.log; then
            echo "Opened a pull request."
          else
            cat pr-error.log
            echo "Could not open a pull request with GITHUB_TOKEN (Actions may not create PRs here); opening an issue instead."
            BODY=$(printf '%s\n\n%s\n\n%s\n\n```diff\n%s\n```\n\n%s' \
              "The **Update security table** workflow found that the Supported Versions table in \`SECURITY.md\` is out of date and pushed the regenerated file to the \`${BRANCH}\` branch." \
              "**[Create the pull request](${COMPARE})**, review it and merge. This issue can be closed afterwards." \
              "Changed rows:" \
              "$CHANGES" \
              "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_")
            EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
              echo "Updated issue #$EXISTING."
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          fi
          echo "### SECURITY.md table changed" >> "$GITHUB_STEP_SUMMARY"
          git diff HEAD~1 -- SECURITY.md | grep '^[-+]|' >> "$GITHUB_STEP_SUMMARY" || true
